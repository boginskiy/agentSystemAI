version: '3.8'
services:
  db:
    image: postgres:16-alpine # Используем легковесный Alpine Linux
    container_name: c_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Опциональные настройки производительности
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_logs:/var/log/postgresql
      # Для инициализации БД при первом запуске можно добавить скрипты:
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pg_data:
  pg_logs: